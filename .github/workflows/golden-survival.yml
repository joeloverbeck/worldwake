# Family-per-matrix-workflow convention: add scenarios to the matrix below; create a
# new golden-<family>.yml when a new scenario family lands (combat, trade, exploration, …).
# See docs/plans/2026-04-17-per-family-golden-scenario-workflows-design.md.
name: Golden Survival

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: golden-survival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: golden-survival / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: ask_consult
            test_target: golden_survival_ask_consult
          - scenario: baseline
            test_target: golden_survival_baseline
          - scenario: combat
            test_target: golden_survival_combat
          - scenario: contested
            test_target: golden_survival_contested
          - scenario: escort
            test_target: golden_survival_escort
          - scenario: final_integration
            test_target: golden_final_integration
          - scenario: items_decay
            test_target: golden_survival_items_decay
          - scenario: justice
            test_target: golden_survival_justice
          - scenario: need_projection
            test_target: golden_need_projection
          - scenario: offices
            test_target: golden_survival_offices
          - scenario: patrol
            test_target: golden_survival_patrol
          - scenario: preferences
            test_target: golden_survival_preferences
          - scenario: production
            test_target: golden_survival_production
          - scenario: scattered
            test_target: golden_survival_scattered
          - scenario: tell
            test_target: golden_survival_tell
          - scenario: theft
            test_target: golden_survival_theft
          - scenario: trade
            test_target: golden_survival_trade

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: golden-survival-${{ matrix.scenario }}

      - name: Run ${{ matrix.test_target }}
        run: cargo test --release -p worldwake-ai --test ${{ matrix.test_target }} -- --ignored --test-threads=1
