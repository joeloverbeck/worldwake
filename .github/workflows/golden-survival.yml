# Family-per-matrix-workflow convention: add scenarios to the matrix below; create a
# new golden-<family>.yml when a new scenario family lands (combat, trade, exploration, …).
# See docs/plans/2026-04-17-per-family-golden-scenario-workflows-design.md.
name: Golden Survival

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: golden-survival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: golden-survival / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: ask_consult
            filter: "scenarios::survival_ask_consult::"
          - scenario: baseline
            filter: "scenarios::survival_baseline::"
          - scenario: combat
            filter: "scenarios::survival_combat::"
          - scenario: contested
            filter: "scenarios::survival_contested::"
          - scenario: escort
            filter: "scenarios::survival_escort::"
          - scenario: final_integration
            filter: "scenarios::final_integration::"
          - scenario: items_decay
            filter: "scenarios::survival_items_decay::"
          - scenario: justice
            filter: "scenarios::survival_justice::"
          - scenario: need_projection
            filter: "scenarios::need_projection::"
          - scenario: offices
            filter: "scenarios::survival_offices::"
          - scenario: patrol
            filter: "scenarios::survival_patrol::"
          - scenario: preferences
            filter: "scenarios::survival_preferences::"
          - scenario: production
            filter: "scenarios::survival_production::"
          - scenario: scattered
            filter: "scenarios::survival_scattered::"
          - scenario: tell
            filter: "scenarios::survival_tell::"
          - scenario: theft
            filter: "scenarios::survival_theft::"
          - scenario: trade
            filter: "scenarios::survival_trade::"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: golden-survival-${{ matrix.scenario }}

      - name: Run golden_ai (${{ matrix.scenario }})
        run: cargo test --release -p worldwake-ai --test golden_ai -- --ignored --test-threads=1 ${{ matrix.filter }}
