# Family-per-matrix-workflow convention: keep long planner pathology replays
# out of default cargo test while preserving dedicated CI ownership.
name: Golden Planner Pathology

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: golden-planner-pathology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: golden-planner-pathology / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: degenerate-zero-step-loop
            test_target: golden_planner_pathology_degenerate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: golden-planner-pathology-${{ matrix.scenario }}

      - name: Run ${{ matrix.test_target }}
        run: cargo test --release -p worldwake-ai --test ${{ matrix.test_target }} -- --ignored --test-threads=1
