name: Soak Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run soak tests
        run: cargo test -p worldwake-ai --features soak --test golden_soak -- --test-threads=1
