# Family-per-matrix-workflow convention: keep long item-decay steady-state
# goldens out of default cargo test while preserving dedicated CI ownership.
name: Golden Item Decay

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: golden-item-decay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: golden-item-decay / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: waste-steady-state
            test_target: golden_item_decay

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: golden-item-decay-${{ matrix.scenario }}

      - name: Run ${{ matrix.test_target }}
        run: cargo test --release -p worldwake-ai --test ${{ matrix.test_target }} -- --ignored --test-threads=1
