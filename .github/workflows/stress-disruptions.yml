name: Stress Disruptions

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  stress-disruptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run stress disruption tests
        run: cargo test -p worldwake-ai --features soak --test golden_resilience t31_stress_disruptions
