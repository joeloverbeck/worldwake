name: Long Scenarios

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  long-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run long scenario tests
        run: cargo test -p worldwake-ai --features soak --test golden_long_scenarios -- --test-threads=1
