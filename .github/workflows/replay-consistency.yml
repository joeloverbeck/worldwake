name: Replay Consistency

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  replay-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run replay consistency and harness unit tests
        run: cargo test -p worldwake-ai --features soak --test golden_resilience -- --skip t31_stress_disruptions
